<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行地點收藏</title><style>
:root{--ink:#233c3b;--muted:#738481;--green:#365d53;--line:#dbe5de;--cream:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}button,input,select,textarea{font:inherit}header{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,24px);border-bottom:1px solid #e8ede8}.brand{font-weight:800;letter-spacing:.12em}.brand i{font-style:normal;background:#e1eee6;border-radius:50%;padding:10px;margin-right:10px}.nav{font-size:13px;color:#82918a;letter-spacing:.12em}.wrap{max-width:1200px;margin:auto;padding:52px 30px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:40px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;color:#799b87}.hero h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,58px);font-weight:500;letter-spacing:.02em;margin:12px 0}.hero p{color:#7b8983;line-height:1.8;margin:0}.add{border:0;background:var(--green);color:white;padding:15px 22px;border-radius:8px;font-weight:650;cursor:pointer;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:42px}.stat{padding:21px 25px;border-right:1px solid var(--line);font-size:13px;color:var(--muted)}.stat:last-child{border:0}.stat b{font-size:24px;color:var(--ink);margin-right:8px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px}.heading h2{font-size:24px;margin:0 0 8px}.heading p{color:var(--muted);font-size:14px;margin:0}.search{width:240px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.filters button{border:1px solid var(--line);background:white;color:#6f8277;padding:9px 16px;border-radius:30px;cursor:pointer}.filters button.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.art{height:150px;position:relative;background:linear-gradient(145deg,#b9cfbf,#e4ead9);display:flex;align-items:center;justify-content:center;font-size:55px}.art.shopping{background:linear-gradient(145deg,#e3cbbd,#f3e8d9)}.art.nature{background:linear-gradient(145deg,#b5cfc2,#dce8d0)}.badge{position:absolute;top:16px;left:16px;background:#ffffffdf;border-radius:20px;padding:6px 11px;font-size:11px;color:#496257}.body{padding:22px}.city{color:#9aa9a0;font-size:11px;letter-spacing:.15em}.body h3{font-size:21px;margin:9px 0}.body p{color:#84918a;font-size:14px;line-height:1.7;min-height:48px;margin:0}.cardfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ed;margin-top:18px;padding-top:16px}.card a{color:#486f5b;text-decoration:none;font-size:13px;font-weight:700}.remove{border:0;background:none;color:#a2aea6;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}footer{text-align:center;color:#a0ada5;font-size:12px;padding:42px}.overlay{position:fixed;inset:0;background:#1d3534a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}.overlay.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:28px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted);line-height:1.6}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce5dd;border-radius:7px;background:white;color:var(--ink)}textarea{resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.cancel{border:1px solid var(--line);background:white;padding:12px 18px;border-radius:8px;cursor:pointer}.error{color:#b54d41!important;min-height:0!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:36px 20px}.hero{align-items:start;flex-direction:column}.heading{align-items:start;flex-direction:column}.search{width:100%}.stat{padding:16px 10px}.nav{display:none}}
</style></head><body><header><div class="brand"><i>✳</i> 旅行地點收藏</div><div class="nav">A LITTLE COLLECTION OF PLACES</div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">YOUR TRAVEL COLLECTION / 旅行靈感</div><h1>把想去的地方，<br>慢慢收集起來。</h1><p>那些收藏起來的地址，都會成為下一趟旅程的靈感。</p></div><button class="add" id="open">＋ 新增地點</button></section><div class="summary"><div class="stat"><b id="count">0</b> 個收藏地點</div><div class="stat"><b id="cities">0</b> 座城市</div><div class="stat"><b id="types">0</b> 種地點類型</div></div><section><div class="heading"><div><div class="eyebrow">THE COLLECTION</div><h2>我的地點清單</h2><p>用城市、類型或關鍵字，找到想去的地方。</p></div><input id="search" class="search" placeholder="⌕  搜尋地點、城市或備註" aria-label="搜尋地點"></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section></main><footer>旅行地點收藏 · 為下一次出發，留下一點靈感<br><br>收藏保存在目前的瀏覽器中；清除瀏覽器資料或更換裝置可能遺失。</footer><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">收藏一個新地點</h2><p>貼上 Google Maps 連結，再填入地點資訊。此版本不會自動讀取地圖資料。</p><form id="form"><label for="url">Google Maps 連結</label><input id="url" type="url" placeholder="https://maps.app.goo.gl/..." required><label for="name">地點名稱</label><input id="name" placeholder="例如：景福宮" required maxlength="80"><div class="formgrid"><div><label for="city">城市</label><input id="city" placeholder="例如：首爾" required maxlength="40"></div><div><label for="type">類型</label><select id="type"><option>景點</option><option>美食</option><option>購物</option><option>自然</option><option>其他</option></select></div></div><label for="note">備註</label><textarea id="note" rows="3" placeholder="為什麼想去？有什麼想記下來的？" maxlength="300"></textarea><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" class="cancel" id="close">取消</button><button class="add" type="submit">儲存地點</button></div></form></div></div><script>
const key='travel-places-v1';const examples=[{id:'ex1',name:'景福宮',city:'首爾',type:'景點',note:'想走走宮殿，感受首爾的歷史與建築。',url:'https://www.google.com/maps/search/?api=1&query=Gyeongbokgung+Palace'},{id:'ex2',name:'聖水洞',city:'首爾',type:'購物',note:'收藏咖啡廳、選物店與街區散步靈感。',url:'https://www.google.com/maps/search/?api=1&query=Seongsu-dong+Seoul'},{id:'ex3',name:'首爾林',city:'首爾',type:'自然',note:'找個時間在綠意裡散步，放慢步調。',url:'https://www.google.com/maps/search/?api=1&query=Seoul+Forest'}];let places;try{places=JSON.parse(localStorage.getItem(key));if(!Array.isArray(places))places=examples}catch{places=examples}let filter='全部';const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(places))}function el(tag,cl,txt){let e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e}function render(){ $('count').textContent=places.length;$('cities').textContent=new Set(places.map(p=>p.city)).size;$('types').textContent=new Set(places.map(p=>p.type)).size;let filters=['全部','景點','美食','購物','自然','其他'];$('filters').replaceChildren(...filters.map(t=>{let b=el('button',filter===t?'active':'',t);b.onclick=()=>{filter=t;render()};return b}));let q=$('search').value.trim().toLowerCase();let matches=places.filter(p=>(filter==='全部'||p.type===filter)&&[p.name,p.city,p.note].some(x=>x.toLowerCase().includes(q)));$('grid').replaceChildren();if(!matches.length){$('grid').append(el('div','empty','沒有符合的地點，試試其他搜尋條件。'));return}for(const p of matches){let card=el('article','card'),art=el('div','art '+(p.type==='購物'?'shopping':p.type==='自然'?'nature':''),({'景點':'⌂','美食':'☕','購物':'✳','自然':'❋','其他':'✧'})[p.type]||'✧');art.prepend(el('span','badge',p.type));let body=el('div','body');body.append(el('div','city',p.city.toUpperCase()),el('h3','',p.name),el('p','',p.note||'尚未新增備註。'));let foot=el('div','cardfoot'),a=el('a','','在 Google Maps 查看 ↗');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';let del=el('button','remove','刪除');del.setAttribute('aria-label','刪除'+p.name);del.onclick=()=>{if(confirm('確定刪除「'+p.name+'」？')){places=places.filter(x=>x.id!==p.id);save();render()}};foot.append(a,del);body.append(foot);card.append(art,body);$('grid').append(card)}}$('open').onclick=()=>{$('overlay').classList.add('show');$('url').focus()};function close(){$('overlay').classList.remove('show');$('open').focus()}$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('search').oninput=render;$('form').onsubmit=e=>{e.preventDefault();let u;try{u=new URL($('url').value);if(u.protocol!=='https:'||!(/(^|\.)google\.[a-z.]+$/.test(u.hostname)||u.hostname==='maps.app.goo.gl'||u.hostname==='goo.gl'))throw Error()}catch{$('error').textContent='請輸入有效的 Google Maps HTTPS 連結。';return}$('error').textContent='';places.unshift({id:Date.now().toString(),url:u.href,name:$('name').value.trim(),city:$('city').value.trim(),type:$('type').value,note:$('note').value.trim()});save();$('form').reset();filter='全部';$('search').value='';render();close()};render();
</script></body></html>
